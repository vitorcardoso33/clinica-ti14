<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica Integrada - Gestão de Consultas</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <header>
    <h1>🩺 Clínica Integrada</h1>
    <nav>
      <button class="on" data-s="dashboard">Dashboard</button>
      <button data-s="consultas">Consultas</button>
      <button data-s="pacientes">Pacientes</button>
    </nav>
  </header>
  <main>
    <p id="msg" hidden></p>

    <section id="dashboard">
      <h2>Visão geral</h2>
      <div id="cards" class="cards"></div>
      <h3>Receita por especialidade (top 5, consultas realizadas)</h3>
      <ul id="top" class="bars"></ul>
    </section>

    <section id="consultas" hidden>
      <h2>Consultas</h2>
      <div class="filtros">
        <input id="busca" type="search" placeholder="Buscar paciente, profissional ou especialidade">
        <select id="status">
          <option value="">Todos os status</option>
          <option>Agendada</option><option>Realizada</option><option>Cancelada</option>
        </select>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>Data</th><th>Paciente</th><th>Profissional</th><th>Status</th><th>Valor</th><th></th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <div class="pag"><button id="ant">← Anterior</button><span id="pag"></span><button id="prox">Próxima →</button></div>
    </section>

    <section id="pacientes" hidden>
      <h2>Novo paciente</h2>
      <form id="form">
        <input name="nome" placeholder="Nome completo" required>
        <input name="nasc" type="date" required>
        <input name="tel" placeholder="Telefone">
        <input name="email" type="email" placeholder="E-mail">
        <button>Cadastrar</button>
      </form>
      <h3>Últimos cadastrados</h3>
      <div class="scroll">
        <table>
          <thead><tr><th>Nome</th><th>Nascimento</th><th>Contato</th><th>Situação</th></tr></thead>
          <tbody id="pac"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="dlg"><div id="det"></div><button onclick="this.closest('dialog').close()">Fechar</button></dialog>
</body>
</html>
